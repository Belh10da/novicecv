<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVICELER CV Maker</title>
  <link rel="stylesheet" href="style.css?v=3" />
  <!-- Google Fonts: Inter for UI, EB Garamond / Times for CV -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- docx library for real .docx generation -->
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <!-- html2pdf for direct PDF download fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <!-- Top Navbar -->
  <header class="topbar no-print">
    <div class="topbar-left">
      <div class="logo-badge">NV</div>
      <div>
        <h1>NOVICELER CV Maker</h1>
        <p>Bilgilerinizi girin, anında canlı önizleyin, PDF veya Word (.docx) olarak indirin</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" id="btnClearAll" class="btn btn-outline-danger" title="Tüm alanları temizle">
        Sıfırla / Temizle
      </button>
      <div class="divider-v"></div>
      <button type="button" id="btnPrintPdf" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        PDF İndir (Vektörel)
      </button>
      <button type="button" id="btnDirectPdf" class="btn btn-secondary" title="Doğrudan PDF dosyası olarak kaydet">
        Hızlı PDF
      </button>
      <button type="button" id="btnDownloadDocx" class="btn btn-word">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Word (.docx) İndir
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="workspace">
    <!-- Left Panel: Form Editor -->
    <section class="editor-panel no-print">
      <!-- Style Settings Bar -->
      <div class="settings-card">
        <div class="setting-item">
          <label for="fontFamilySelect">Yazı Tipi:</label>
          <select id="fontFamilySelect">
            <option value="'Times New Roman', Times, serif">Times New Roman (Klasik)</option>
            <option value="'EB Garamond', Georgia, serif">Garamond (Akademik)</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Inter', Arial, sans-serif">Inter / Arial (Modern)</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="fontSizeSelect">Boyut:</label>
          <select id="fontSizeSelect">
            <option value="10pt">10 pt (Yoğun CV)</option>
            <option value="10.5pt" selected>10.5 pt (Standart)</option>
            <option value="11pt">11 pt (Geniş)</option>
          </select>
        </div>
      </div>

      <!-- 1. Personal & Contact Info -->
      <div class="form-section personal-info-section">
        <div class="section-header">
          <h2>👤 1. KİŞİSEL VE İLETİŞİM BİLGİLERİ (AD SOYAD, MAİL, LINKEDIN)</h2>
        </div>
        <div class="form-grid">
          <div class="form-group full-width">
            <label for="fullName">Ad Soyad (CV'nin En Üstünde Görünür)</label>
            <input type="text" id="fullName" placeholder="Örn: AHMET YILMAZ" />
          </div>
          <div class="form-group">
            <label for="emailPrimary">E-posta Adresi 1</label>
            <input type="email" id="emailPrimary" placeholder="Örn: ad.soyad@gmail.com" />
          </div>
          <div class="form-group">
            <label for="emailSecondary">E-posta Adresi 2 (Opsiyonel / Okul Maili)</label>
            <input type="email" id="emailSecondary" placeholder="Örn: ad.soyad@universite.edu.tr" />
          </div>
          <div class="form-group">
            <label for="phoneInput">Telefon Numarası</label>
            <input type="text" id="phoneInput" placeholder="Örn: (+90) 5XX XXX XX XX" />
          </div>
          <div class="form-group">
            <label for="linkedinInput">LinkedIn Linki</label>
            <input type="text" id="linkedinInput" placeholder="Örn: linkedin.com/in/ad-soyad" />
          </div>
          <div class="form-group full-width">
            <label>Ek İletişim / Portfolyo / GitHub / Şehir (Opsiyonel)</label>
            <div id="extraContactsList" class="inline-items-list"></div>
            <button type="button" class="btn-add-sub" id="btnAddContact">+ Ek İletişim Alanı Ekle</button>
          </div>
        </div>
      </div>

      <!-- Dynamic Sections Container (Education, Experience, Leadership, Volunteer, Certifications, Skills) -->
      <div id="sectionsEditorContainer"></div>

      <!-- Add Custom Section Button -->
      <div class="add-section-box">
        <button type="button" id="btnAddSection" class="btn btn-add-section">
          + Yeni Bölüm Ekle (Örn: Projeler, Yayınlar, Ödüller)
        </button>
      </div>
    </section>

    <!-- Right Panel: Live A4 Preview -->
    <section class="preview-panel">
      <div class="preview-toolbar no-print">
        <span>Canlı A4 Önizleme (Değişiklikler anında yansır)</span>
        <span class="badge-hint">İpucu: "PDF İndir (Vektörel)" seçeneğinde Hedef olarak "PDF olarak kaydet" seçin.</span>
      </div>
      <div class="a4-wrapper">
        <div id="cvPage" class="a4-page">
          <!-- Rendered dynamically by app.js -->
        </div>
      </div>
    </section>
  </main>

  <script src="app.js?v=3"></script>
</body>
</html>
